<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbe4ea">
<title>Love Days</title>
<style>
  /* Patrick Hand (SIL Open Font License 1.1, see OFL.txt), bundled: templates load no external URL. */
  @font-face {
    font-family: "Patrick Hand";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url(assets/fonts/patrick-hand-vietnamese.woff2) format("woff2");
    unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;
  }
  @font-face {
    font-family: "Patrick Hand";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url(assets/fonts/patrick-hand-latin-ext.woff2) format("woff2");
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: "Patrick Hand";
    font-style: normal;
    font-weight: 400;
    font-display: swap;
    src: url(assets/fonts/patrick-hand-latin.woff2) format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  :root {
    --rose: #d95c72;
    --fill: #ee8194;
    --fill-dark: #e06a80;
    --line: #eba0ad;
    --ink: #3a3034;
    --muted: #7d6d72;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: linear-gradient(180deg, #fbe2e9 0%, #fdeef2 38%, #fdf3f6 62%, #fae4eb 100%);
    font-family: "Patrick Hand", "Comic Sans MS", cursive;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #app {
    position: relative;
    height: 100dvh;
    max-width: 440px;
    margin: 0 auto;
    display: flex; flex-direction: column; align-items: center;
    padding: max(14px, env(safe-area-inset-top)) 0 0;
    overflow: hidden;
    animation: appIn .8s ease both;
  }
  @keyframes appIn { from { opacity: 0; } }

  h1 {
    margin-top: calc(32px + 4dvh);
    font-weight: 400;
    font-size: clamp(24px, 7.4vw, 31px);
    letter-spacing: .14em;
    color: var(--rose);
    text-indent: .14em;
    animation: rise .9s cubic-bezier(.2,.8,.25,1) .1s both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }

  /* ---------- trái tim ---------- */
  .heart-wrap {
    position: relative;
    width: min(94vw, 400px, 48dvh);
    aspect-ratio: 260 / 236;
    margin-top: .5dvh;
    cursor: pointer;
    touch-action: manipulation;
    animation: pop 1s cubic-bezier(.3,1.4,.5,1) .25s both;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.7); } }
  .heart-wrap svg { width: 100%; height: 100%; display: block; overflow: visible; }
  #heartBody { transform-box: fill-box; transform-origin: 50% 55%; transition: transform .16s cubic-bezier(.3,1.6,.5,1); }
  .heart-wrap.pressed #heartBody { transform: scale(1.09); transition-duration: .1s; }
  .heart-wrap.beat #heartBody { animation: beat 1.1s ease-in-out infinite; }
  @keyframes beat { 0%,100% { transform: scale(1); } 14% { transform: scale(1.07); } 28% { transform: scale(1); } 42% { transform: scale(1.045); } 60% { transform: scale(1); } }

  .ring { fill: none; stroke: #e595a3; stroke-width: 2.2; vector-effect: non-scaling-stroke;
    transform-box: fill-box; transform-origin: 50% 55%;
    opacity: 0; animation: ripple 2.4s cubic-bezier(.2,.6,.35,1) infinite; transition: stroke-opacity .15s; }
  .ring:nth-child(2) { animation-delay: .8s; }
  .ring:nth-child(3) { animation-delay: 1.6s; }
  @keyframes ripple {
    0% { transform: scale(1); opacity: 0; }
    10% { opacity: 1; }
    70% { opacity: .55; }
    100% { transform: scale(1.17); opacity: 0; }
  }
  .heart-wrap.pressed .ring { stroke-opacity: 0; }

  #gloss { opacity: 0; transition: opacity .5s ease; }
  .heart-wrap.full #gloss { opacity: 1; }
  #rim { transition: opacity .5s; }
  .heart-wrap.full #rim { opacity: 0; }
  #base { transition: fill .5s; }
  .heart-wrap.full #base { fill: var(--fill); }

  .hint {
    height: 20px; margin-top: .4dvh;
    font-size: 15px; color: #c47a88;
    transition: opacity .5s;
    animation: hint 2s ease-in-out 1.4s infinite both;
  }
  @keyframes hint { 0%,100% { opacity: .9; } 50% { opacity: .4; } }
  .hint.gone { animation: none; opacity: 0; }

  /* ---------- bộ đếm ---------- */
  .counter {
    margin-top: 1.4dvh;
    width: min(76%, 310px);
    padding: 14px 10px 13px;
    border-radius: 18px;
    background: rgba(255,255,255,.78);
    box-shadow: 0 6px 22px rgba(214,140,160,.16);
    text-align: center;
    animation: rise .9s cubic-bezier(.2,.8,.25,1) .45s both;
  }
  .days { font-size: clamp(20px, 6vw, 24px); letter-spacing: .02em; color: #2f2a2c; }
  .clock { margin-top: 2px; font-size: clamp(25px, 7.6vw, 31px); letter-spacing: .04em; color: #222; font-variant-numeric: tabular-nums; }

  /* ---------- hai người ---------- */
  .couple {
    margin-top: auto;
    width: 100%;
    padding: 18px 8% calc(22px + env(safe-area-inset-bottom));
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    background: linear-gradient(rgba(255,255,255,0), rgba(255,255,255,.65) 30%);
    animation: rise 1s cubic-bezier(.2,.8,.25,1) .65s both;
  }
  @media (min-width: 460px) { .couple { border-radius: 26px 26px 0 0; } }
  .person { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .person:first-child { justify-self: start; }
  .person:last-child { justify-self: end; }
  .avatar {
    width: clamp(62px, 19vw, 76px); aspect-ratio: 1;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 4px 14px rgba(170,90,110,.22);
    overflow: hidden;
    display: grid; place-items: center;
    background: linear-gradient(140deg, #fbd3dc, #f3a9b8);
    color: #fff; font-size: 30px; text-shadow: 0 1px 3px rgba(190,80,105,.35);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .name { font-size: 14px; color: var(--muted); max-width: 110px; text-align: center; line-height: 1.1; }
  .mid { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 18px; }
  .mini-heart { width: 34px; height: 31px; animation: beat 1.4s ease-in-out infinite; }
  .date { font-size: 13px; color: var(--muted); letter-spacing: .03em; }

  /* ---------- hộp chúc mừng ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 20;
    display: flex; justify-content: center;
    background: rgba(255,247,250,.62);
    opacity: 0; visibility: hidden;
    transition: opacity .28s ease, visibility 0s linear .28s;
  }
  .modal.show { opacity: 1; visibility: visible; transition: opacity .28s ease; }
  .sheet {
    position: absolute; top: 120px;
    width: min(88vw, 390px);
    max-height: calc(100dvh - 240px);
    overflow-y: auto; scrollbar-width: none;
    padding: 18px 20px 14px;
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 14px 40px rgba(200,110,135,.22), 0 1px 3px rgba(0,0,0,.05);
    text-align: center;
    transform: translateY(14px) scale(.97);
    transition: transform .4s cubic-bezier(.2,.9,.3,1.1);
  }
  .sheet::-webkit-scrollbar { display: none; }
  .modal.show .sheet { transform: none; }
  .close {
    position: absolute; right: 12px; top: 10px;
    width: 30px; height: 30px; border: 0; background: none; cursor: pointer;
    color: #8a7d82; display: grid; place-items: center;
  }
  .close svg { width: 14px; height: 14px; }
  .sheet h2 { font-weight: 400; font-size: 24px; color: var(--rose); }
  .sub { font-size: 14px; color: #4a4044; margin-top: 2px; }
  .frame {
    position: relative;
    margin: 14px auto 0;
    width: 100%;
    aspect-ratio: 1 / 1.04;
    border: 1.6px dashed #c9bfc3;
    border-radius: 12px;
    padding: 7px;
    cursor: zoom-in;
  }
  .frame .ph {
    position: absolute; inset: 7px; border-radius: 7px;
    display: grid; place-items: center; align-content: center; gap: 6px;
    color: #c99aa5; font-size: 14px;
    background: repeating-linear-gradient(135deg, #fffafb 0 10px, #fdf2f5 10px 20px);
  }
  .frame .ph svg { width: 40px; height: 40px; opacity: .75; }
  .frame img {
    position: relative; width: 100%; height: 100%; display: block;
    object-fit: cover; border-radius: 7px;
    opacity: 0; transform: scale(1.03);
    transition: opacity .6s ease, transform .9s cubic-bezier(.2,.8,.25,1);
  }
  .frame img.in { opacity: 1; transform: none; }
  .caption { margin-top: 8px; font-size: 14px; color: #6b5f63; }

  /* ---------- xem ảnh toàn màn hình ---------- */
  .viewer {
    position: fixed; inset: 0; z-index: 30;
    background: #0e0c0d;
    display: grid; place-items: center;
    opacity: 0; visibility: hidden;
    transition: opacity .3s ease, visibility 0s linear .3s;
    cursor: zoom-out;
  }
  .viewer.show { opacity: 1; visibility: visible; transition: opacity .3s ease; }
  .viewer img { max-width: 100%; max-height: 100dvh; object-fit: contain; transform: scale(.94); transition: transform .4s cubic-bezier(.2,.8,.25,1); }
  .viewer.show img { transform: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    .ring { display: none; }
  }
  /* The gift page's reduced-motion request (LoveGift sets it on <html>). */
  html[data-reduced-motion="true"] *, html[data-reduced-motion="true"] *::before, html[data-reduced-motion="true"] *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  html[data-reduced-motion="true"] .ring { display: none; }
</style>
</head>
<body>
<div id="app">
  <h1 id="title"></h1>

  <div class="heart-wrap" id="heart" role="button" tabindex="0" aria-label="Chạm vào trái tim">
    <svg viewBox="-30 -26 260 236">
      <defs>
        <path id="hp" d="M100 176 C 70 150, 6 112, 6 60 C 6 28, 30 6, 58 6 C 78 6, 92 17, 100 32 C 108 17, 122 6, 142 6 C 170 6, 194 28, 194 60 C 194 112, 130 150, 100 176 Z"/>
        <clipPath id="clip"><use href="#hp"/></clipPath>
        <mask id="lm" maskUnits="userSpaceOnUse" x="-30" y="-26" width="260" height="236"><path id="liquidM" fill="#fff"/></mask>
        <radialGradient id="shade" cx=".5" cy=".42" r=".62">
          <stop offset=".72" stop-color="#000" stop-opacity="0"/>
          <stop offset="1" stop-color="#b8304c" stop-opacity=".22"/>
        </radialGradient>
        <linearGradient id="miniG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffb3c1"/><stop offset="1" stop-color="#f06c88"/>
        </linearGradient>
      </defs>
      <g id="rings"><use href="#hp" class="ring"/><use href="#hp" class="ring"/><use href="#hp" class="ring"/></g>
      <g id="heartBody">
        <use href="#hp" id="base" fill="#fff"/>
        <g clip-path="url(#clip)">
          <path id="liquid" fill="var(--fill)"/>
          <path id="liquid2" fill="var(--fill-dark)" opacity=".35"/>
          <use href="#hp" fill="url(#shade)" mask="url(#lm)"/>
          <g id="gloss" fill="#fff">
            <path d="M34 26 C 46 16, 66 14, 78 20 C 66 20, 50 24, 40 31 Z" opacity=".75"/>
            <path d="M124 21 C 138 13, 160 14, 172 24 C 158 21, 142 21, 130 26 Z" opacity=".75"/>
          </g>
        </g>
        <g id="rim">
          <use href="#hp" fill="none" stroke="#f2b3bd" stroke-width="7"/>
          <use href="#hp" fill="none" stroke="#e5899a" stroke-width="2"/>
        </g>
      </g>
    </svg>
  </div>
  <p class="hint" id="hint"></p>

  <div class="counter" aria-live="off">
    <div class="days" id="days"></div>
    <div class="clock" id="clock"></div>
  </div>

  <div class="couple">
    <div class="person"><div class="avatar" id="av1"></div><div class="name" id="n1"></div></div>
    <div class="mid">
      <svg class="mini-heart" viewBox="0 0 34 31"><path d="M17 29.5C11 25 1.5 19 1.5 10.2 1.5 5.3 5 1.5 9.5 1.5c3.3 0 5.9 2 7.5 4.6 1.6-2.6 4.2-4.6 7.5-4.6 4.5 0 8 3.8 8 8.7C32.5 19 23 25 17 29.5z" fill="url(#miniG)"/><ellipse cx="9.5" cy="7.5" rx="3.4" ry="2" fill="#fff" opacity=".55" transform="rotate(-25 9.5 7.5)"/></svg>
      <div class="date" id="date"></div>
    </div>
    <div class="person"><div class="avatar" id="av2"></div><div class="name" id="n2"></div></div>
  </div>
</div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="popTitle">
    <button class="close" id="close" aria-label="Đóng"><svg viewBox="0 0 14 14"><path d="M1.5 1.5l11 11M12.5 1.5l-11 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <h2 id="popTitle"></h2>
    <p class="sub" id="popSub"></p>
    <div class="frame" id="frame"></div>
    <p class="caption" id="popCaption"></p>
  </div>
</div>

<div class="viewer" id="viewer" aria-hidden="true"></div>

<!-- Cấu hình mặc định. LoveMemory ghép giá trị của món quà vào đây (template.json → path);
     avatar để "" thì hiện chữ cái đầu của tên; nhạc do trang món quà phát. -->
<script type="application/json" id="gift-config">
{
  "startDate": "2023-08-14",
  "title": "LOVE DAYS",
  "daysLabel": "DAYS",
  "person1": { "name": "Thiên Minh", "avatar": "" },
  "person2": { "name": "Hana", "avatar": "" },
  "tapsToFill": 8,
  "startFill": 0.12,
  "hint": "Chạm vào trái tim nhé ♡",
  "popupTitle": "Chúc mừng!",
  "popupSubtitle": "Trái tim đã đầy.",
  "popupCaption": "Cảm ơn vì em đã đến 🤍",
  "photo": "assets/photo.jpg",
  "music": ""
}
</script>

<script>
const CONFIG = LoveGift.config();

const $ = id => document.getElementById(id);
const reduce = LoveGift.reducedMotion() || matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- Nội dung ----------
$("title").textContent = CONFIG.title;
$("hint").textContent = CONFIG.hint;
$("popTitle").textContent = CONFIG.popupTitle;
$("popSub").textContent = CONFIG.popupSubtitle;
$("popCaption").textContent = CONFIG.popupCaption;
document.title = CONFIG.title.charAt(0) + CONFIG.title.slice(1).toLowerCase();

function loadImg(src, ok, fail) {
  if (!src) return fail();
  const img = new Image(); img.alt = "";
  img.onload = () => ok(img); img.onerror = fail; img.src = src;
}
[[CONFIG.person1, "av1", "n1"], [CONFIG.person2, "av2", "n2"]].forEach(([p, av, n]) => {
  $(n).textContent = p.name;
  const box = $(av);
  box.textContent = (p.name || "♡").trim().charAt(0).toUpperCase();
  loadImg(p.avatar, img => { box.textContent = ""; box.appendChild(img); }, () => {});
});

// ---------- Bộ đếm ngày ----------
function parseStart(s) {
  const m = String(s).match(/(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (!m) return new Date();
  return new Date(+m[1], m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
}
const start = parseStart(CONFIG.startDate);
const pad = v => String(v).padStart(2, "0");
$("date").textContent = `${pad(start.getDate())}/${pad(start.getMonth() + 1)}/${start.getFullYear()}`;

function tickClock() {
  const now = new Date();
  // số ngày theo lịch (tránh lệch do giờ mùa hè)
  let days = Math.floor((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) -
                         Date.UTC(start.getFullYear(), start.getMonth(), start.getDate())) / 864e5);
  let secs = (now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds()) -
             (start.getHours() * 3600 + start.getMinutes() * 60 + start.getSeconds());
  if (secs < 0) { secs += 86400; days--; }
  if (days < 0) { days = 0; secs = 0; }
  $("days").textContent = `${days} ${CONFIG.daysLabel}`;
  $("clock").textContent = `${pad(Math.floor(secs / 3600))} : ${pad(Math.floor(secs / 60) % 60)} : ${pad(secs % 60)}`;
}
tickClock();
setInterval(tickClock, 250);

// ---------- Trái tim chứa nước ----------
const heart = $("heart"), liquid = $("liquid"), liquid2 = $("liquid2"), liquidM = $("liquidM");
const TOP = 6, BOT = 176;                    // mép trên/dưới của hình tim trong viewBox
let target = Math.min(1, Math.max(0, CONFIG.startFill)), level = reduce ? target : 0, full = false;

function wavePath(y, amp, len, phase) {
  let d = `M-20 ${BOT + 20} L-20 ${y.toFixed(2)}`;
  for (let x = -20; x <= 220; x += 6) d += ` L${x} ${(y + Math.sin(x / len * 2 * Math.PI + phase) * amp).toFixed(2)}`;
  return d + ` L220 ${BOT + 20} Z`;
}
function draw(t) {
  level += (target - level) * (reduce ? 1 : 0.075);
  if (Math.abs(target - level) < 0.0005) level = target;
  const y = BOT - (BOT - TOP + 8) * level;   // +8: phủ kín cả hai thùy khi đầy
  const calm = level >= 0.999 ? 0 : 1;
  const amp = reduce ? 0 : (1.4 + Math.min(2.2, Math.abs(target - level) * 30)) * calm;
  const d = wavePath(y, amp, 120, t / 650);
  liquid.setAttribute("d", d); liquidM.setAttribute("d", d);
  liquid2.setAttribute("d", wavePath(y + 2.5, amp * .8, 95, -t / 520 + 1.7));
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function release() { heart.classList.remove("pressed"); }
heart.addEventListener("pointerdown", e => {
  heart.classList.add("pressed");
  if (heart.setPointerCapture) try { heart.setPointerCapture(e.pointerId); } catch (_) {}
});
["pointerup", "pointercancel", "pointerleave"].forEach(ev => heart.addEventListener(ev, release));
heart.addEventListener("click", tapHeart);
heart.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); tapHeart(); } });

let openTimer = 0;
function tapHeart() {
  $("hint").classList.add("gone");
  if (full) { openModal(); return; }
  target = Math.min(1, target + 1 / Math.max(1, CONFIG.tapsToFill));
  if (target >= 0.999) {
    full = true;
    LoveGift.scene("heart-full");
    setTimeout(() => heart.classList.add("full", "beat"), reduce ? 0 : 450);
    openTimer = setTimeout(openModal, reduce ? 300 : 1100);
  }
}

// ---------- Hộp chúc mừng + ảnh ----------
const modal = $("modal"), sheet = $("sheet"), frame = $("frame"), viewer = $("viewer");
let photoImg = null;
function placeholder() {
  frame.innerHTML = `<div class="ph"><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.6-4.6-9.7-9.3C.8 7.8 3 4 6.7 4c2.2 0 3.6 1.3 4.3 2.6C11.7 5.3 13.1 4 15.3 4 19 4 21.2 7.8 19.7 11.2c-2.1 4.7-7.7 9.3-7.7 9.3z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg><span>Chưa có ảnh</span></div>`;
  frame.style.cursor = "default";
}
placeholder();
loadImg(CONFIG.photo, img => { photoImg = img; frame.style.cursor = ""; }, () => {});

function layoutSheet() {
  const app = $("app").getBoundingClientRect();
  const top = $("title").getBoundingClientRect().bottom + 10;
  const bottom = document.querySelector(".couple").getBoundingClientRect().top + 30;
  sheet.style.top = top + "px";
  sheet.style.maxHeight = Math.max(260, bottom - top) + "px";
  sheet.style.width = Math.min(app.width * .88, 390) + "px";
}
function openModal() {
  clearTimeout(openTimer);
  if (modal.classList.contains("show")) return;
  layoutSheet();
  modal.classList.add("show"); modal.setAttribute("aria-hidden", "false");
  LoveGift.complete();
  if (photoImg && !frame.contains(photoImg)) {
    // khung trống một nhịp rồi ảnh mới hiện ra, giống video
    setTimeout(() => { frame.innerHTML = ""; frame.appendChild(photoImg);
      requestAnimationFrame(() => requestAnimationFrame(() => photoImg.classList.add("in"))); }, reduce ? 0 : 900);
  }
}
function closeModal() { modal.classList.remove("show"); modal.setAttribute("aria-hidden", "true"); }
$("close").addEventListener("click", closeModal);
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });
addEventListener("resize", () => { if (modal.classList.contains("show")) layoutSheet(); });

frame.addEventListener("click", () => {
  if (!photoImg || !frame.contains(photoImg)) return;
  const big = new Image(); big.alt = ""; big.src = photoImg.src;
  viewer.innerHTML = ""; viewer.appendChild(big);
  viewer.classList.add("show"); viewer.setAttribute("aria-hidden", "false");
});
viewer.addEventListener("click", () => { viewer.classList.remove("show"); viewer.setAttribute("aria-hidden", "true"); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (viewer.classList.contains("show")) viewer.click(); else closeModal();
});
