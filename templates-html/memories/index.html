  }
  :root {
    --ink: #3f3237;
    --muted: #8c7c83;
    --pink: #ef8aa2;
    --pink-deep: #e56f8c;
    --pink-soft: #f9dbe3;
    --pink-band: #f8d3dc;
    --red: #e0313f;
    --paper: #fffdfd;
    --bg: #fdf2f5;
    --hand: "Patrick Hand", "Comic Sans MS", cursive;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #f3dfe5;
    font-family: var(--hand);
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  #app {
    position: relative;
    width: min(100vw, 440px);
    height: 100dvh;
    margin: 0 auto;
    overflow: hidden;
    background: var(--bg);
    box-shadow: 0 0 40px rgba(170, 100, 120, .18);
  }
  .screen {
    position: absolute; inset: 0;
    overflow: hidden;
    opacity: 0; visibility: hidden;
    transform: translateY(14px) scale(.985);
    transition: opacity .45s ease, transform .5s cubic-bezier(.2,.8,.25,1), visibility 0s .5s;
  }
  .screen.active { opacity: 1; visibility: visible; transform: none; transition: opacity .45s ease, transform .5s cubic-bezier(.2,.8,.25,1), visibility 0s; z-index: 2; }
  .scroll { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }

  .back {
    position: absolute; left: 14px; top: calc(12px + env(safe-area-inset-top)); z-index: 20;
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 13px 5px 9px;
    font-family: "Quicksand", sans-serif; font-size: 12px; font-weight: 500; color: #7d6b72;
    background: rgba(255,255,255,.72);
    border-radius: 999px;
    box-shadow: 0 1px 5px rgba(170, 110, 130, .18);
    backdrop-filter: blur(4px);
  }
  .back svg { width: 12px; height: 12px; }
  .back:active { transform: scale(.95); }

  /* ---------- Intro ---------- */
  #s-intro { background: radial-gradient(ellipse 90% 70% at 50% 45%, #fdf1f4 0%, #f9e2e8 60%, #f4d3dc 100%); display: grid; place-items: center; }
  .big-heart { position: relative; width: min(74vw, 320px); aspect-ratio: 200 / 182; animation: beat 1.25s ease-in-out infinite; cursor: pointer; filter: drop-shadow(0 14px 22px rgba(214, 110, 140, .32)); }
  .big-heart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .big-heart .txt { position: absolute; inset: 22% 8% 24%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; color: #fff; font-family: "Quicksand", sans-serif; text-shadow: 0 1px 3px rgba(200, 90, 120, .35); }
  .big-heart h1 { font-weight: 500; font-size: min(6.2vw, 26px); letter-spacing: .5px; line-height: 1.1; white-space: nowrap; transform: rotate(-3deg); }
  .big-heart .yrs { font-size: min(3.4vw, 14px); font-weight: 600; letter-spacing: 2.5px; margin-top: 6px; }
  .start { margin-top: 12px; padding: 4px 16px; border-radius: 999px; background: rgba(255,255,255,.92); color: #d97890; font-family: "Quicksand", sans-serif; font-size: 12px; font-weight: 600; box-shadow: 0 2px 8px rgba(200, 90, 120, .25); text-shadow: none; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.07); } 28% { transform: scale(.99); } 42% { transform: scale(1.04); } 60% { transform: scale(1); } }
  .intro-hint { position: absolute; bottom: calc(9dvh + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 16px; color: #c17b8d; animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  #s-intro.leaving .big-heart { animation: none; transform: scale(1.6); opacity: 0; transition: transform .6s ease-in, opacity .5s ease-in; }

  /* ---------- Lock ---------- */
  #s-lock { background: linear-gradient(#fbe9ee, #f7dbe3); display: grid; place-items: center; padding: 20px; }
  .lock-card {
    width: min(100%, 330px);
    background: #fff;
    border-radius: 18px;
    padding: 26px 22px 20px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(190, 110, 135, .18);
  }
  .lock-card .gheart { width: 26px; height: 24px; margin: 0 auto 6px; display: block; }
  .lock-card h2 { font-weight: 400; font-size: 25px; letter-spacing: 1px; text-transform: uppercase; }
  .lock-card .hint { font-size: 13px; color: var(--muted); margin-top: 1px; }
  .pins { display: flex; justify-content: center; gap: 12px; margin: 18px 0 18px; }
  .pins input {
    flex: 0 1 46px; min-width: 0; height: 50px;
    border: 1.5px solid #cfc4c8; border-radius: 10px;
    text-align: center; font-family: var(--hand); font-size: 22px; color: var(--ink);
    outline: none; background: #fff;
    box-shadow: inset 0 1px 3px rgba(0,0,0,.05);
    transition: border-color .2s, box-shadow .2s, transform .2s;
  }
  .pins input:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(239, 138, 162, .22); }
  .pins.shake { animation: shake .45s; }
  .pins.ok input { border-color: #ef8aa2; background: #fff3f6; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  .unlock {
    width: 100%; padding: 11px; border-radius: 999px;
    background: linear-gradient(#f07f99, #e86c89); color: #fff;
    font-size: 16px; letter-spacing: .3px;
    box-shadow: 0 6px 14px rgba(232, 108, 137, .35);
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .unlock:active { transform: scale(.98); }
  .unlock svg { width: 15px; height: 15px; }
  .lock-card .sub { font-size: 12px; color: var(--muted); margin-top: 14px; min-height: 1.3em; }
  .lock-card .sub.err { color: #d9506f; }

  /* ---------- Home ---------- */
  #s-home { background: #fff; }
  #s-home .scroll { background: #fff; }
  .home-head {
    position: relative;
    padding: calc(22px + env(safe-area-inset-top)) 16px 16px;
    text-align: center;
    background: linear-gradient(#fbe1e8, #f9d6df);
  }
  .home-head h1 { font-weight: 400; font-size: 29px; letter-spacing: 2px; color: #4a3940; }
  .menu { list-style: none; background: #f7cfd9; padding: 0 0 16px; }
  .menu li { padding-top: 16px; }
  .menu button {
    display: flex; flex-direction: column; align-items: center;
    width: 100%; padding: 18px 16px 14px;
    background: linear-gradient(#fff, #fffbfc);
    box-shadow: 0 0 10px 3px rgba(255,255,255,.85);
    text-align: center;
    transition: transform .2s ease, background .2s;
    opacity: 0; transform: translateY(18px);
  }
  #s-home.active .menu button { animation: rise .6s cubic-bezier(.2,.8,.25,1) forwards; }
  #s-home.active .menu li:nth-child(2) button { animation-delay: .08s; }
  #s-home.active .menu li:nth-child(3) button { animation-delay: .16s; }
  #s-home.active .menu li:nth-child(4) button { animation-delay: .24s; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .menu button:active { background: #fff4f7; }
  .menu .ico { width: 66px; height: 66px; margin-bottom: 8px; transition: transform .3s; }
  .menu button:hover .ico { transform: translateY(-3px) rotate(-3deg); }
  .menu .t { font-size: 17px; font-weight: 400; color: #3b2f34; }
  .menu .d { font-size: 13px; color: #7e6f75; margin-top: 1px; }
  .menu .h { width: 11px; height: 11px; margin-top: 5px; color: #9b8b92; }
  .home-foot { text-align: center; padding: 6px 0 calc(22px + env(safe-area-inset-bottom)); font-size: 13px; color: #c27a8c; background: #f7cfd9; }

  /* ---------- Love Days ---------- */
  #s-days { background: linear-gradient(#fdf2f6 0%, #fbe8ee 55%, #f8d9e2 100%); }
  .days-wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: calc(64px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom)); }
  .days-title { font-weight: 400; font-size: 27px; letter-spacing: 5px; color: #e67a92; text-transform: uppercase; }
  .heart-box { position: relative; width: min(72vw, 300px); aspect-ratio: 220 / 200; margin-top: 3dvh; cursor: pointer; }
  .heart-box svg { width: 100%; height: 100%; overflow: visible; display: block; }
  .heart-box .draw { fill: none; stroke: #ec8098; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .heart-box .sk { fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
  .counter {
    margin-top: 5dvh;
    width: min(76%, 290px);
    padding: 12px 10px 13px;
    text-align: center;
    background: rgba(255,255,255,.62);
    border-radius: 20px;
    box-shadow: 0 6px 18px rgba(220, 140, 165, .14), inset 0 0 0 1px rgba(255,255,255,.7);
  }
  .counter .dn { font-size: 19px; letter-spacing: 1px; color: #3d3036; }
  .counter .tm { font-size: 27px; letter-spacing: 2px; color: #3d3036; line-height: 1.1; margin-top: 2px; }
  .counter .tm:empty { display: none; }
  .couple { margin-top: 6dvh; width: 100%; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 8px; }
  .person { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 84px; }
  .avatar { width: 66px; height: 66px; border-radius: 50%; overflow: hidden; border: 3px solid #fff; box-shadow: 0 4px 12px rgba(210, 120, 150, .25); background: #f7d3dc; display: grid; place-items: center; font-size: 26px; color: #fff; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .person span { font-size: 13px; color: #6f5f66; }
  .mid { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 22px; }
  .mid svg { width: 30px; height: 28px; animation: beat 1.4s ease-in-out infinite; }
  .mid span { font-size: 12px; color: #6f5f66; letter-spacing: .5px; }

  /* popup */
  .popup { position: absolute; inset: 0; z-index: 30; display: grid; place-items: center; padding: 18px; background: rgba(250, 225, 233, .35); opacity: 0; visibility: hidden; transition: opacity .35s, visibility 0s .35s; }
  .popup.show { opacity: 1; visibility: visible; transition: opacity .35s, visibility 0s; }
  .pop-card { position: relative; width: min(100%, 360px); max-height: 88%; overflow-y: auto; scrollbar-width: none; background: linear-gradient(#fff, #fff8fa); border-radius: 20px; padding: 18px 16px 18px; text-align: center; box-shadow: 0 18px 40px rgba(190, 100, 130, .28); transform: scale(.85) translateY(18px); transition: transform .5s cubic-bezier(.25,1.4,.5,1); }
  .popup.show .pop-card { transform: none; }
  .pop-card h3 { font-family: "Dancing Script", cursive; font-weight: 700; font-size: 25px; color: #ec7f98; }
  .pop-card .s { font-size: 13px; color: var(--muted); margin-top: -2px; }
  .pop-x { position: absolute; right: 12px; top: 12px; width: 28px; height: 28px; display: grid; place-items: center; color: #a3939a; }
  .pop-x svg { width: 15px; height: 15px; }
  .pop-photo { margin: 12px 4px 0; padding: 7px; border: 1.5px dashed #d9b9c3; border-radius: 16px; background: #fff; }
  .pop-photo .ph { width: 100%; aspect-ratio: 4 / 3.4; border-radius: 11px; overflow: hidden; }
  .pop-photo p { font-size: 14px; line-height: 1.35; color: #5b4c53; padding: 9px 6px 3px; overflow-wrap: anywhere; }

  /* ---------- Gallery ---------- */
  #s-gallery .scroll {
    background-color: #fff;
    background-image:
      linear-gradient(90deg, transparent calc(50% - 9px), rgba(248, 205, 216, .75) calc(50% - 9px), rgba(248, 205, 216, .75) calc(50% + 9px), transparent calc(50% + 9px));
  }
  .gal-head { height: calc(56px + env(safe-area-inset-top)); background: linear-gradient(#fbdde5, rgba(251, 221, 229, 0)); }
  .grid { position: relative; padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
  .row { position: relative; display: grid; grid-template-columns: 1fr 1fr; align-items: start; gap: 18px; padding: 16px 14px 18px; border-bottom: 16px solid rgba(248, 205, 216, .7); }
  .row:last-child { border-bottom: 0; }
  .row .tile:nth-child(2) { margin-top: 26px; }
  .tile { background: #fff; padding: 7px 7px 4px; box-shadow: 0 3px 12px rgba(180, 110, 130, .16); cursor: zoom-in; opacity: 0; transform: translateY(16px); }
  #s-gallery.active .tile { animation: rise .6s cubic-bezier(.2,.8,.25,1) forwards; }
  .tile .ph { aspect-ratio: 4 / 5; overflow: hidden; }
  .tile p { font-size: 13px; line-height: 1.3; text-align: center; color: #4d3f45; padding: 7px 2px 6px; min-height: 2.2em; }
  .tile:active { transform: scale(.97); }
  .ph { position: relative; background: #e4e1e3; }
  .ph.loading::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.55) 50%, transparent 70%); background-size: 220% 100%; animation: shimmer 1.3s linear infinite; }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .5s; }
  .ph img.in { opacity: 1; }
  .ph .empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: linear-gradient(140deg, #fbe5eb, #f4cbd6); color: #b86d82; font-size: 12px; text-align: center; padding: 8px; }
  .ph .empty svg { width: 28px; height: 28px; opacity: .8; }
  .sticker { position: absolute; pointer-events: none; }
  .sticker.heart1 { left: calc(50% - 17px); top: -10px; width: 34px; z-index: 2; filter: drop-shadow(0 2px 3px rgba(220, 130, 155, .3)); }
  .sticker.xoxo { left: 6px; top: -22px; font-size: 15px; color: #a7979e; transform: rotate(-16deg); letter-spacing: 1px; z-index: 2; }
  .sticker.heart2 { right: 4px; bottom: -6px; width: 22px; opacity: .85; z-index: 2; transform: rotate(14deg); }
  .lightbox { position: absolute; inset: 0; z-index: 40; background: rgba(12, 8, 10, .88); display: grid; place-items: center; padding: 16px; opacity: 0; visibility: hidden; transition: opacity .3s, visibility 0s .3s; cursor: zoom-out; }
  .lightbox.show { opacity: 1; visibility: visible; transition: opacity .3s, visibility 0s; }
  .lightbox .ph { width: 100%; max-height: 82dvh; aspect-ratio: 4 / 5; border-radius: 6px; overflow: hidden; background: #2b2427; }
  .lightbox .ph img { object-fit: contain; }
  .lightbox p { position: absolute; left: 0; right: 0; bottom: calc(26px + env(safe-area-inset-bottom)); text-align: center; color: #fbe3ea; font-size: 16px; padding: 0 20px; }

  /* ---------- Letter ---------- */
  #s-letter { background: linear-gradient(#fdf1f5, #fae6ed); }
  .env-stage { position: absolute; inset: 0; display: grid; place-items: center; }
  .env {
    --EW: min(62vw, 260px);
    position: relative; width: var(--EW); height: calc(var(--EW) * .64);
    cursor: pointer; margin-top: -4dvh;
  }
  .env > * { position: absolute; }
  .env .e-back { inset: 0; background: #fbe4eb; border: 1.4px solid #c78097; border-radius: 2px; }
  .env .e-front { inset: 0; z-index: 3; }
  .env .e-front svg, .env .flap svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .env .flap { left: 0; top: 0; width: 100%; height: 56%; z-index: 4; transform-origin: 50% 0; transition: transform .55s cubic-bezier(.55,0,.35,1); }
  .env .seal { left: 50%; top: 56%; width: 9%; z-index: 5; transform: translate(-50%, -50%); transition: opacity .3s; }
  .env .seal svg { width: 100%; display: block; }
  .env .peek {
    left: 8%; width: 84%; top: 8%; height: 76%; z-index: 2;
    background: #fff; box-shadow: 0 2px 8px rgba(150, 90, 110, .15);
    display: grid; place-items: center;
    font-size: calc(var(--EW) * .07); color: #4b3a41;
    transition: transform .55s cubic-bezier(.3,.8,.3,1);
  }
  .env .peek.front { z-index: 6; }
  .env.open .flap { transform: rotateX(180deg); }
  .env.flipped .flap { z-index: 1; }
  .env.flipped .flap path { fill: #f9d3de; }
  .env.up .peek { transform: translateY(-82%); }
  .env.down .peek { transform: translateY(46%) scale(1.12); box-shadow: 0 8px 22px rgba(150, 90, 110, .22); cursor: pointer; }
  .env.idle:not(.open) { animation: wobble 2.6s ease-in-out 1.2s infinite; }
  @keyframes wobble { 0%, 80%, 100% { transform: rotate(0); } 84% { transform: rotate(-3deg); } 88% { transform: rotate(3deg); } 92% { transform: rotate(-2deg); } 96% { transform: rotate(1deg); } }

  holder.innerHTML = markup;
  return holder.firstElementChild;
}

// ---------- ảnh + placeholder ----------
function fillPhoto(box, src) {
  box.textContent = "";
  box.classList.add("loading");
  const empty = () => {
    box.classList.remove("loading");
    box.textContent = "";
    const placeholder = el("div", "empty");
    placeholder.appendChild(svgNode(`<svg><use href="#cam"/></svg>`));
    placeholder.appendChild(el("span", "", "Chưa có ảnh"));
    box.appendChild(placeholder);
  };
  if (!src) return empty();
  const img = new Image();
  img.alt = "";
  img.decoding = "async";
  img.onload = () => { box.classList.remove("loading"); requestAnimationFrame(() => img.classList.add("in")); };
  img.onerror = empty;
  box.appendChild(img);
  img.src = src;
}
function fillAvatar(box, src, name) {
  const initial = () => { box.textContent = ((name || "♡").trim() || "♡")[0].toUpperCase(); };
  initial();
  if (!src) return;
  const img = new Image(); img.alt = "";
  img.onload = () => { box.textContent = ""; box.appendChild(img); };
  img.src = src;
}

// ---------- thời gian (ngày theo giờ địa phương) ----------
function parseStart(value) {
  const m = String(value).match(/(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (!m) return new Date();
  return new Date(+m[1], m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
}
const start = parseStart(CONFIG.startDate);
function elapsed() {
  const ms = Math.max(0, Date.now() - start.getTime());
  const days = Math.floor(ms / 864e5), rest = ms % 864e5;
  const p = n => String(n).padStart(2, "0");
  return { days, time: `${p(Math.floor(rest / 36e5))} : ${p(Math.floor(rest / 6e4) % 60)} : ${p(Math.floor(rest / 1e3) % 60)}` };
}

  const input = document.createElement("input");

  input.maxLength = 1;
  input.setAttribute("aria-label", "Số " + (i + 1));

pins.forEach((inp, i) => {
  inp.addEventListener("input", () => {
    inp.value = inp.value.replace(/\D/g, "").slice(-1);
    if (inp.value && i < pins.length - 1) pins[i + 1].focus();
    if (code().length === pins.length) tryUnlock();
  });
  inp.addEventListener("keydown", e => {
    if (e.key === "Backspace" && !inp.value && i > 0) pins[i - 1].focus();
    if (e.key === "Enter") tryUnlock();
  });
  inp.addEventListener("paste", e => {
    const t = (e.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, pins.length);
    if (!t) return; e.preventDefault();
    pins.forEach((p, k) => p.value = t[k] || ""); if (t.length === pins.length) tryUnlock();
  });
});

async function tryUnlock() {
  const msg = $("#lockMsg");
  if (code() === PASS) {
    unlocked = true;
    pinBox.classList.add("ok"); msg.classList.remove("err"); msg.textContent = "Đúng rồi nè ♡";

    show("home");

    msg.classList.add("err"); msg.textContent = code().length < pins.length ? `Nhập đủ ${pins.length} số nha` : "Sai rồi, thử lại nha ♡";
    pinBox.classList.remove("shake"); void pinBox.offsetWidth; pinBox.classList.add("shake");

  }
}

const drawPath = $("#drawPath"), wave = $("#wave"), shine = $("#shine"), sketches = $("#sketches");
const LEN = drawPath.getTotalLength();
function sketchD(scale, rot, jit, seed) {
  let r = seed;
  const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647 - .5;
  const pts = [], n = 54, a = rot * Math.PI / 180;
  for (let i = 0; i <= n + 3; i++) {
    const q = drawPath.getPointAtLength((i % n) / n * LEN);
    let x = (q.x - 100) * scale, y = (q.y - 90) * scale;
    const w = 1 + Math.sin(i / 4 + seed) * .012;
    pts.push([100 + (x * Math.cos(a) - y * Math.sin(a)) * w + rnd() * jit, 90 + (x * Math.sin(a) + y * Math.cos(a)) * w + rnd() * jit]);
  }
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const m = [(pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2];
    d += ` Q${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)} ${m[0].toFixed(1)} ${m[1].toFixed(1)}`;
  }
  return d;
}

].map(([s, r, w, c, o, j, seed]) => `<path class="sk" d="${sketchD(s, r, j, seed)}" stroke="${c}" stroke-width="${w}" data-o="${o}"/>`).join("");
const skPaths = [...sketches.children];

let daysRun = 0, tickTimer = 0, ticking = false, paused = false;
function setCounter(n, withTime) {
  $("#dayNum").textContent = `${n} DAYS`;
  $("#dayTime").textContent = withTime ? elapsed().time : "";
}
function startTicker() {
  clearInterval(tickTimer);
  ticking = true;
  if (!paused) tickTimer = setInterval(() => setCounter(elapsed().days, true), 1000);
}
// Trang món quà bị ẩn: dừng đồng hồ đếm, chạy tiếp khi "lovegift:play".
addEventListener("lovegift:pause", () => { paused = true; clearInterval(tickTimer); });
addEventListener("lovegift:play", () => { paused = false; if (ticking && current === "days") startTicker(); });
function tween(ms, fn) {
  return new Promise(res => {
    if (reduced) { fn(1); return res(); }
    const t0 = performance.now();
    (function step(now) {
      const k = Math.min(1, (now - t0) / ms);
      fn(k);
      k < 1 ? requestAnimationFrame(step) : res();
    })(t0);
  });
}
const ease = k => 1 - Math.pow(1 - k, 3);
function waveD(level, phase) {
  const y = 172 - level * 172;
  let d = `M-12 ${y}`;
  for (let x = -12; x <= 212; x += 8) d += ` L${x} ${(y + Math.sin(x / 18 + phase) * 4 * (1 - level * .7)).toFixed(2)}`;
  return d + " L212 200 L-12 200 Z";
}
enter.days = async () => {
  const run = ++daysRun;
  popup.classList.remove("show");
  clearInterval(tickTimer); ticking = false;
  drawPath.style.transition = "none";
  drawPath.style.strokeDasharray = LEN; drawPath.style.strokeDashoffset = LEN;
  drawPath.style.opacity = 1;
  skPaths.forEach(p => { p.style.transition = "none"; p.style.opacity = 0; p.style.strokeDashoffset = p.dataset.l; });
  wave.setAttribute("d", waveD(0, 0)); shine.setAttribute("opacity", 0);
  setCounter(0, false);
  await wait(350);
  if (run !== daysRun) return;
  // vẽ viền trái tim + đếm ngày
  const total = elapsed().days;
  const countUp = tween(1100, k => setCounter(Math.round(ease(k) * total), k === 1));
  await tween(1300, k => { drawPath.style.strokeDashoffset = LEN * (1 - ease(k)); });
  await countUp;
  if (run !== daysRun) return;
  startTicker();
  // các nét viền nguệch ngoạc
  for (const p of skPaths) {
    p.style.opacity = p.dataset.o;
    p.style.transition = reduced ? "none" : "stroke-dashoffset .55s ease-out";
    p.style.strokeDashoffset = 0;
    await wait(260);
  }
  await wait(500);
  if (run !== daysRun) return;
  // đổ màu từ dưới lên
  await tween(2000, k => wave.setAttribute("d", waveD(ease(k) * 1.04, k * 9)));
  if (run !== daysRun) return;
  shine.setAttribute("opacity", .14);
  await wait(700);
  if (run === daysRun && current === "days") openPopup();
};

// ---------- Caro ----------
const board = $("#board"), gTitle = $("#gTitle"), gStatus = $("#gStatus"), again = $("#again"), strike = $("#strike"), strikeLine = $("#strikeLine");
$("#winMsg").textContent = CONFIG.game.winText;
const cells = [...Array(9)].map((_, i) => { const b = document.createElement("button"); b.type = "button"; b.setAttribute("aria-label", "Ô " + (i + 1)); board.insertBefore(b, strike); return b; });
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const X_SVG = `<svg class="x" viewBox="0 0 24 24"><path d="M3 3l18 18" stroke="#e0313f" stroke-width="1.8" stroke-linecap="round"/><path d="M21 3L3 21" stroke="#e0313f" stroke-width="1.8" stroke-linecap="round"/></svg>`;
let cellsState, over, busy;
function winner(s) { for (const l of LINES) if (s[l[0]] && s[l[0]] === s[l[1]] && s[l[1]] === s[l[2]]) return l; return null; }
function status(label, who) {
  gStatus.textContent = label + " ";
  if (who === "X") { const mark = el("b", "", "✕"); mark.style.cssText = "font-weight:400;font-size:17px"; gStatus.appendChild(mark); }
  else gStatus.appendChild(svgNode(HEART("#e0313f")));
}
function newGame() {
  cellsState = Array(9).fill(""); over = false; busy = false;
  cells.forEach(c => c.innerHTML = "");
  board.classList.remove("won"); strike.classList.remove("on");
  gTitle.textContent = CONFIG.game.title;
  status(CONFIG.game.nextLabel, "H");
  again.classList.remove("show");
}
function place(i, who) { cellsState[i] = who; cells[i].innerHTML = who === "H" ? HEART("#e0313f") : X_SVG; }
function aiMove() {
  const free = cellsState.map((v, i) => v ? -1 : i).filter(i => i >= 0);
  // máy chơi "nhường": chỉ chặn đôi khi, không bao giờ cố thắng
  if (Math.random() < .45) for (const l of LINES) {
    const v = l.map(i => cellsState[i]);
    if (v.filter(x => x === "H").length === 2 && v.includes("")) return l[v.indexOf("")];
  }
  const safe = free.filter(i => { const t = cellsState.slice(); t[i] = "X"; return !winner(t); });
  const pool = safe.length ? safe : free;
  if (pool.includes(4) && Math.random() < .5) return 4;
  return pool[Math.floor(Math.random() * pool.length)];
}
function finish(line, who) {
  over = true;
  if (line) {
    const c = i => [50 + (i % 3) * 100, 50 + Math.floor(i / 3) * 100];
    const [a, b] = [c(line[0]), c(line[2])];
    const dx = (b[0] - a[0]) * .2, dy = (b[1] - a[1]) * .2;
    strikeLine.setAttribute("x1", a[0] - dx); strikeLine.setAttribute("y1", a[1] - dy);
    strikeLine.setAttribute("x2", b[0] + dx); strikeLine.setAttribute("y2", b[1] + dy);
    requestAnimationFrame(() => strike.classList.add("on"));
  }
  gTitle.textContent = who === "H" ? CONFIG.game.winTitle : who === "X" ? CONFIG.game.loseTitle : CONFIG.game.drawTitle;
  gTitle.classList.remove("pop"); void gTitle.offsetWidth; gTitle.classList.add("pop");
  if (who) status(CONFIG.game.winnerLabel, who); else gStatus.textContent = "Không ai thắng, chơi lại nha ♡";
  if (who === "H") {
    board.classList.add("won");
    const r = board.getBoundingClientRect();
    setTimeout(() => burst(r.left + r.width / 2, r.top + r.height / 2, 26), 350);
  }
  setTimeout(() => again.classList.add("show"), 500);
}
cells.forEach((c, i) => c.addEventListener("click", async () => {
  if (over || busy || cellsState[i]) return;
  place(i, "H");
  let w = winner(cellsState);
  if (w) return finish(w, "H");
  if (!cellsState.includes("")) return finish(null, "");
  busy = true; status(CONFIG.game.nextLabel, "X");
  await wait(520);
  if (current !== "game" || over) { busy = false; return; }
  place(aiMove(), "X");
  busy = false;
  w = winner(cellsState);
  if (w) return finish(w, "X");
  if (!cellsState.includes("")) return finish(null, "");
  status(CONFIG.game.nextLabel, "H");
}));
again.addEventListener("click", e => { e.stopPropagation(); newGame(); });
$("#s-game").addEventListener("click", e => {
  if (!over || !board.classList.contains("won") || e.target.closest(".again,.back")) return;
  burst(e.clientX, e.clientY, 14);
});
function burst(x, y, n) {
  if (reduced) return;
  const app = $("#app"), base = app.getBoundingClientRect();
  for (let k = 0; k < n; k++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.innerHTML = HEART(["#e0313f", "#ef4b5f", "#f0627a", "#d42a3c"][k % 4]);
    const s = .6 + Math.random() * .9;
    p.style.left = (x - base.left - 7) + "px"; p.style.top = (y - base.top - 6) + "px";
    app.appendChild(p);
    const a = Math.random() * Math.PI * 2, d = 50 + Math.random() * 110;
    p.style.cssText += `;--tx:${(Math.cos(a) * d).toFixed(1)}px;--ty:${(Math.sin(a) * d).toFixed(1)}px;--s:${s.toFixed(2)};--r1:${((Math.random() - .5) * 90).toFixed(0)}deg;--r2:${((Math.random() - .5) * 220).toFixed(0)}deg;animation-duration:${(1300 + Math.random() * 900).toFixed(0)}ms`;
    p.addEventListener("animationend", () => p.remove());
  }
}
enter.game = () => newGame();

// Các khối role="button" mở được bằng bàn phím (Enter, Space) như một nút.
document.querySelectorAll('[role="button"]').forEach(b => b.addEventListener("keydown", e => {
  if (e.target === b && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); b.click(); }
}));

// ---------- Khởi động ----------
show("intro");
</script>
</body>
</html>
